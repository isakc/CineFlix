<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0c20" />
      <stop offset="50%" stop-color="#180e29" />
      <stop offset="100%" stop-color="#2a0845" />
    </linearGradient>
    
    <!-- Neon Pink / Crimson Gradient -->
    <linearGradient id="reelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2a6d" />
      <stop offset="50%" stop-color="#fd0054" />
      <stop offset="100%" stop-color="#990000" />
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe600" />
      <stop offset="100%" stop-color="#ff9100" />
    </linearGradient>

    <!-- Glow Effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container Box with Rounded Corners -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect width="496" height="496" x="8" y="8" rx="120" fill="none" stroke="url(#reelGrad)" stroke-width="8" stroke-opacity="0.6" />

  <!-- Main Film Reel & Play Element -->
  <g transform="translate(0, 0)">
    <!-- Outer Film Ring -->
    <circle cx="256" cy="256" r="165" fill="none" stroke="url(#reelGrad)" stroke-width="26" filter="url(#glow)" />
    
    <!-- Film Reel Holes -->
    <circle cx="256" cy="135" r="28" fill="#180e29" />
    <circle cx="256" cy="377" r="28" fill="#180e29" />
    <circle cx="135" cy="256" r="28" fill="#180e29" />
    <circle cx="377" cy="256" r="28" fill="#180e29" />
    <circle cx="170" cy="170" r="22" fill="#180e29" />
    <circle cx="342" cy="170" r="22" fill="#180e29" />
    <circle cx="170" cy="342" r="22" fill="#180e29" />
    <circle cx="342" cy="342" r="22" fill="#180e29" />

    <!-- Center Play Icon -->
    <circle cx="256" cy="256" r="68" fill="#180e29" stroke="url(#goldGrad)" stroke-width="6" />
    <path d="M 240 216 L 292 256 L 240 296 Z" fill="url(#goldGrad)" />
  </g>
</svg>