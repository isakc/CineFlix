<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14141E" />
      <stop offset="100%" stop-color="#0A0A10" />
    </linearGradient>

    <!-- Cinema Crimson Gradient -->
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2A42" />
      <stop offset="50%" stop-color="#E50914" />
      <stop offset="100%" stop-color="#9E000B" />
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE066" />
      <stop offset="50%" stop-color="#FFB800" />
      <stop offset="100%" stop-color="#FF8800" />
    </linearGradient>

    <!-- Premium Glow Effect -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#E50914" flood-opacity="0.45" />
    </filter>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#FFB800" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Dark Luxury Squircle Frame -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="116" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="6" />

  <!-- Iconic CineFlix Cinema Clapper / 'C' Emblem -->
  <g filter="url(#softGlow)">
    <!-- Clapper Top Strips -->
    <path d="M 120 160 L 392 160 C 408 160 418 174 418 190 L 418 200 L 94 200 L 94 190 C 94 174 104 160 120 160 Z" fill="#202230" />
    
    <!-- Diagonal Film Stripes on Clapper Top -->
    <path d="M 135 160 L 165 200 L 195 200 L 165 160 Z" fill="url(#goldGrad)" />
    <path d="M 225 160 L 255 200 L 285 200 L 255 160 Z" fill="url(#goldGrad)" />
    <path d="M 315 160 L 345 200 L 375 200 L 345 160 Z" fill="url(#goldGrad)" />

    <!-- Main Screen / Clapper Body -->
    <rect x="94" y="208" width="324" height="180" rx="20" fill="url(#redGrad)" />

    <!-- Cinema Film Holes Left & Right -->
    <rect x="108" y="224" width="16" height="24" rx="4" fill="rgba(255,255,255,0.25)" />
    <rect x="108" y="260" width="16" height="24" rx="4" fill="rgba(255,255,255,0.25)" />
    <rect x="108" y="296" width="16" height="24" rx="4" fill="rgba(255,255,255,0.25)" />
    <rect x="108" y="332" width="16" height="24" rx="4" fill="rgba(255,255,255,0.25)" />

    <rect x="388" y="224" width="16" height="24" rx="4" fill="rgba(255,255,255,0.25)" />
    <rect x="388" y="260" width="16" height="24" rx="4" fill="rgba(255,255,255,0.25)" />
    <rect x="388" y="296" width="16" height="24" rx="4" fill="rgba(255,255,255,0.25)" />
    <rect x="388" y="332" width="16" height="24" rx="4" fill="rgba(255,255,255,0.25)" />

    <!-- Center Play Triangle (Gold Accent) -->
    <g filter="url(#goldGlow)">
      <polygon points="230,250 310,298 230,346" fill="url(#goldGrad)" />
    </g>
  </g>
</svg>