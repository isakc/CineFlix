spring:
  application:
    name: spring-boot-demo-test

  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true

tmdb:
  api:
    base-url: https://api.themoviedb.org/3
    key: sample_key

jwt:
  secret: cineflix_secret_jwt_key_super_secure_random_string_2026_demo_project_key
  expiration-ms: 86400000

spring.security:
  oauth2:
    client:
      registration:
        google:
          client-id: dummy-google-test-id
          client-secret: dummy-google-test-secret
          scope:
            - email
            - profile
        naver:
          client-id: dummy-naver-test-id
          client-secret: dummy-naver-test-secret
          client-authentication-method: client_secret_post
          authorization-grant-type: authorization_code
          redirect-uri: "{baseUrl}/{action}/oauth2/code/{registrationId}"
          scope:
            - name
            - email
            - profile_image
          client-name: Naver
      provider:
        naver:
          authorization-uri: https://nid.naver.com/oauth2.0/authorize
          token-uri: https://nid.naver.com/oauth2.0/token
          user-info-uri: https://openapi.naver.com/v1/nid/me
          user-name-attribute: response
